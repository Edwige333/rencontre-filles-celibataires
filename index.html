<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CœurConnect — Site de rencontre</title>
<style>
:root{--pink:#e91e63;--dark:#241521;--light:#fff7fa;--muted:#75656d;--card:#fff;--line:#eadde3}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--light);color:var(--dark)}
header{background:linear-gradient(135deg,#e91e63,#9c27b0);color:white;padding:16px 22px;position:sticky;top:0;z-index:10}
.nav{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-size:23px;font-weight:800}.nav button{background:#ffffff22;border:1px solid #ffffff55;color:white;border-radius:22px;padding:9px 14px}
main{max-width:1100px;margin:auto;padding:25px 16px}.hero{background:linear-gradient(135deg,#fff,#ffe4ef);border-radius:24px;padding:35px 25px;text-align:center;margin-bottom:22px}.hero h1{font-size:38px;margin:8px}.hero p{color:var(--muted);font-size:17px}
button,.btn{cursor:pointer;border:0;border-radius:12px;padding:12px 17px;font-weight:700}.primary{background:var(--pink);color:white}.secondary{background:#f3e8ed;color:var(--dark)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #0000000b}.photo{height:220px;width:100%;object-fit:cover;background:#f1dce5}.cardbody{padding:15px}.card h3{margin:0 0 6px}.muted{color:var(--muted);font-size:14px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button.active{background:var(--pink);color:#fff}
section.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px}
form{max-width:620px;margin:auto}.field{margin-bottom:13px}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d9cbd2;border-radius:10px;font-size:15px}.field textarea{min-height:100px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hidden{display:none!important}.notice{padding:12px;border-radius:10px;background:#fff1f5;margin-bottom:14px}.success{background:#edf9f0;color:#166534}.error{background:#fff0f0;color:#a11}
footer{text-align:center;color:var(--muted);padding:30px 10px;font-size:13px}
@media(max-width:600px){.two{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style>
</head>
<body>
<header>
<div class="nav"><div class="logo">❤️ CœurConnect</div><div id="navActions"></div></div>
</header>
<main>
<div id="app"></div>
</main>
<footer>© 2026 CœurConnect — Première version de démonstration</footer>

<script>
const profiles=[
{id:1,name:"Amina",age:27,city:"Cotonou",country:"Bénin",bio:"J’aime voyager, découvrir de nouveaux endroits et faire de belles rencontres.",img:"https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=700&q=80"},
{id:2,name:"Sarah",age:31,city:"Porto-Novo",country:"Bénin",bio:"Souriante, simple et passionnée par la musique et la cuisine.",img:"https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=700&q=80"},
{id:3,name:"David",age:30,city:"Cotonou",country:"Bénin",bio:"J’aime le sport, les voyages et les discussions intéressantes.",img:"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=700&q=80"},
{id:4,name:"Mélissa",age:26,city:"Abomey-Calavi",country:"Bénin",bio:"Optimiste et sociable. Je cherche une relation sérieuse.",img:"https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=700&q=80"}
];

const app=document.getElementById("app");
function getUser(){return JSON.parse(localStorage.getItem("cc_user")||"null")}
function setUser(u){localStorage.setItem("cc_user",JSON.stringify(u))}
function likes(){return JSON.parse(localStorage.getItem("cc_likes")||"[]")}
function saveLikes(x){localStorage.setItem("cc_likes",JSON.stringify(x))}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function nav(){
 const u=getUser();
 document.getElementById("navActions").innerHTML=u?`<button onclick="show('home')">Accueil</button> <button onclick="show('profile')">Mon profil</button> <button onclick="logout()">Déconnexion</button>`:`<button onclick="show('login')">Connexion</button> <button onclick="show('register')">S'inscrire</button>`;
}
function show(page){
 nav();
 if(page==="home") home();
 if(page==="register") register();
 if(page==="login") login();
 if(page==="profile") profile();
 if(page==="matches") matches();
 if(page==="messages") messages();
 window.scrollTo({top:0,behavior:"smooth"});
}
function home(){
 const u=getUser();
 app.innerHTML=`<div class="hero"><h1>Faites une belle rencontre ❤️</h1><p>Découvrez des personnes, échangez et créez de nouvelles connexions.</p>${u?`<button class="primary" onclick="show('matches')">Découvrir les profils</button>`:`<button class="primary" onclick="show('register')">Créer mon compte</button>`}</div>
 <div class="tabs"><button class="active" onclick="show('home')">Profils</button>${u?`<button onclick="show('matches')">Mes likes</button><button onclick="show('messages')">Messages</button>`:""}</div>
 <div class="grid">${profiles.map(p=>card(p)).join("")}</div>`;
}
function card(p){
 const liked=likes().includes(p.id);
 return `<div class="card"><img class="photo" src="${p.img}" alt="Photo de ${escapeHtml(p.name)}"><div class="cardbody"><h3>${escapeHtml(p.name)}, ${p.age}</h3><div class="muted">📍 ${escapeHtml(p.city)}, ${escapeHtml(p.country)}</div><p>${escapeHtml(p.bio)}</p><div class="actions"><button class="${liked?'secondary':'primary'}" onclick="like(${p.id})">${liked?'❤️ Aimé':'♡ J’aime'}</button><button class="secondary" onclick="chat('${escapeHtml(p.name)}')">💬 Message</button></div></div></div>`;
}
function like(id){
 if(!getUser()){show("login");return}
 let x=likes(); x=x.includes(id)?x.filter(a=>a!==id):[...x,id]; saveLikes(x); home();
}
function chat(name){if(!getUser()){show("login");return} messages(name)}
function register(){
 app.innerHTML=`<section class="panel"><h2>Créer un compte</h2><div id="regMsg"></div><form onsubmit="doRegister(event)">
 <div class="two"><div class="field"><label>Prénom</label><input id="rname" required></div><div class="field"><label>Âge</label><input id="rage" type="number" min="18" max="100" required></div></div>
 <div class="two"><div class="field"><label>Genre</label><select id="rgender" required><option value="">Choisir</option><option>Femme</option><option>Homme</option><option>Autre</option></select></div><div class="field"><label>Pays</label><input id="rcountry" value="Bénin" required></div></div>
 <div class="field"><label>Ville</label><input id="rcity" required></div>
 <div class="field"><label>Email</label><input id="remail" type="email" required></div>
 <div class="field"><label>Mot de passe</label><input id="rpass" type="password" minlength="6" required></div>
 <div class="field"><label>Présentation</label><textarea id="rbio" placeholder="Parlez un peu de vous..."></textarea></div>
 <button class="primary" type="submit">Créer mon compte</button> <button class="secondary" type="button" onclick="show('login')">J’ai déjà un compte</button>
 </form></section>`;
}
function doRegister(e){
 e.preventDefault();
 const u={name:rname.value,age:rage.value,gender:rgender.value,country:rcountry.value,city:rcity.value,email:remail.value,password:rpass.value,bio:rbio.value};
 setUser(u); document.getElementById("regMsg").innerHTML=`<div class="notice success">Compte créé avec succès. Bienvenue ${escapeHtml(u.name)} !</div>`; setTimeout(()=>show("home"),600);
}
function login(){
 app.innerHTML=`<section class="panel"><h2>Connexion</h2><div id="loginMsg"></div><form onsubmit="doLogin(event)">
 <div class="field"><label>Email</label><input id="lemail" type="email" required></div>
 <div class="field"><label>Mot de passe</label><input id="lpass" type="password" required></div>
 <button class="primary" type="submit">Se connecter</button> <button class="secondary" type="button" onclick="show('register')">Créer un compte</button>
 </form></section>`;
}
function doLogin(e){
 e.preventDefault();
 const u=getUser();
 if(u&&u.email===lemail.value&&u.password===lpass.value){show("home")}else document.getElementById("loginMsg").innerHTML=`<div class="notice error">Email ou mot de passe incorrect. Pour cette démo, le compte doit être créé sur cet appareil.</div>`;
}
function profile(){
 const u=getUser(); if(!u){show("login");return}
 app.innerHTML=`<section class="panel"><h2>Mon profil</h2><form onsubmit="saveProfile(event)">
 <div class="field"><label>Prénom</label><input id="pname" value="${escapeHtml(u.name)}" required></div>
 <div class="two"><div class="field"><label>Âge</label><input id="page" type="number" min="18" value="${escapeHtml(u.age)}" required></div><div class="field"><label>Ville</label><input id="pcity" value="${escapeHtml(u.city)}" required></div></div>
 <div class="field"><label>Pays</label><input id="pcountry" value="${escapeHtml(u.country)}" required></div>
 <div class="field"><label>Présentation</label><textarea id="pbio">${escapeHtml(u.bio)}</textarea></div>
 <button class="primary">Enregistrer</button>
 </form></section>`;
}
function saveProfile(e){e.preventDefault();let u=getUser();u.name=pname.value;u.age=page.value;u.city=pcity.value;u.country=pcountry.value;u.bio=pbio.value;setUser(u);alert("Profil mis à jour.");show("profile")}
function matches(){
 const ids=likes();const ps=profiles.filter(p=>ids.includes(p.id));
 app.innerHTML=`<h2>Mes likes ❤️</h2>${ps.length?`<div class="grid">${ps.map(card).join("")}</div>`:`<section class="panel">Vous n’avez encore aimé aucun profil. <button class="primary" onclick="show('home')">Découvrir les profils</button></section>`}`;
}
function messages(name=""){
 app.innerHTML=`<section class="panel"><h2>💬 Messages</h2><p class="muted">Première version : interface de messagerie locale.</p><div class="notice">Conversation ${name?`avec <b>${escapeHtml(name)}</b>`:""}</div><div class="field"><textarea id="msg" placeholder="Écrivez votre message..."></textarea></div><button class="primary" onclick="sendMsg()">Envoyer</button></section>`;
}
function sendMsg(){if(!msg.value.trim())return;alert("Message enregistré dans cette démo.");msg.value=""}
function logout(){localStorage.removeItem("cc_user");show("home")}
show("home");
</script>
</body>
</html>
